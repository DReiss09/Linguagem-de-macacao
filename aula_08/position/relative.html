<!DOCTYPE html>
<html lang="pt-br">

    <head>

        <meta charset="UTF-8">
        <link rel="stylesheet" type="text/css" href="style.css">

        <title>Position: Relative</title>

        <style>
            
            .static{
                position: static;
                border: 3px solid #8edd21;
                margin-top: 10%;
            }
            .relative{
                position: relative;
                margin-left: 30px;
                border: 3px solid #8edd21;
            }

        </style>

    </head>

    <body>

        <div class="static">
            Essa Div tem o estilo Position: static;
        </div>

        <div class="relative">
            Essa Div tem o estilo Position: relative;
        </div>

    </body>

</html>
