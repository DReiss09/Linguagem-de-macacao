<!DOCTYPE html>
<html lang="pt-br">
	<head>
		<meta charset="UTF-8">
		<title>Exercício 1</title>
	</head>
	<body>
		<!-- table -> Tabela -->
		<!-- Iniciando a tabela -->
		<table border="1" width="100%">
			<!-- thead -> table head -> cabeçalho da Tabela -->
			<thead style="background-color: green; color: #000000;">
				<!-- Criando a primeira linha -->
				<!-- linha da tabela -> table row -> tr -->
				<header style="background-color: #0fa838">
			<h1 style="text-align: center; color: #000000;">Tabela de Serviço Mecânicos</h1>
			<hr>
		</header>
			</thead>
			<!-- tbody -> table body -> corpo da tabela -->
			<tbody>
				<!-- Criando a segunada linha -->
				<!-- Linha da tabela -> table row -> tr -->
				<tr>
					<!-- td -> table data -> dados da tabela -->
					<td rowspan="5" style="background-color: #2a3d2f; color: #000000">Nacionais</td>
					<td style="background-color: #939994; color: #000000">Veículos</td>
					<td style="background-color: #939994; color: #000000">Serviços</td>
					<td style="background-color: #939994; color: #000000">Tempo Previsto</td>
					<td style="background-color: #939994; color: #000000">Valor</td>
					
				</tr>
				
				<!-- Criando a terceira linha -->
				<!-- linha da tabela -> table row -> tr -->
				<tr>
					<td>Caminhonete S10</td>
					<td>Suspenção</td>
					<td>3 horas e 25 minutos</td>
					<td>350,00</td>
					
				</tr>
				
				<!-- Criando a quarta linha -->
				<tr>
					<!-- COLSPAN -> masclar colunas -->
					<td>Caminhonete Ranger</td>
					<td>Freio</td>
					<td>3 horas e 45 minutos</td>
					<td>200,00</td>
				</tr>
				
				<!-- Criando a quinta linha -->
				<tr>
					<td>Caminhonete Hilux</td>
					<td>Troca de Bateria</td>
					<td>30 minutos</td>
					<td>25,00</td>
				</tr>
				
				<!-- Criando a sexta linha -->
				<tr>
					<td>Caminhonete D10</td>
					<td>Alinhamento</td>
					<td>1 hora e 40 minutos</td>
					<td>220,00</td>
					
				</tr>
			</tbody>
		</table>
	</body>
</html>
