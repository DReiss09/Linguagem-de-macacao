<!DOCTYPE html>
<html lang="pt-br">
	<head>
		<meta charset="UTF-8">
		<title>Exemplo 2 - Table</title>
	</head>
	<body>
		<table border="1" width="100%">
		<tr style="background-color:purple; color: white">
			<th>cabeçalho 1</th>
			<th>cabeçalho 2</th>
			<th>cabeçalho 3</th>
		</tr>
		<tr>
			<td style="background-color:#000;color:#fff;">Conteúdo 1</td>
			<td>
				<table border="1" width="100%">
					<tr>
						<td style="background-color: yellow;">1</td>
						<td style="background-color: red; color: #fff; text-align:right;">2</td>
					</tr>
					<tr>
						<td style="background-color: blue; color: #fff; text-align:right;">3</td>
						<td style="background-color: #2cff05;">4</td>
					</tr>
				</table>
			</td>
			<td style="background-image:url('https://i.pinimg.com/474x/a4/74/fd/a474fdb574fd88ba05900ce6d39573db.jpg');">Conteúdo 3</td>
		</tr>
		<tr>
			<td style="background-color: #000; color: #fff;">Conteúdo 4</td>
			<td style="background-image:url('https://www.shutterstock.com/image-vector/white-gray-horizontal-zigzag-lines-260nw-787491442.jpg');">Conteúdo 5</td>
			<td>
				<table border="1" width="100%">
					<tr>
						<td style="background-color: orange;">5</td>
						<td style="background-color: pink;">6</td>
					</tr>
					<tr>
						<td style="background-color: red; text-align:right;">7</td>
						<td style="background-color: orange; text-align:center;">8</td>
					</tr>
				</table>
			</td>
		</table>
	</body>
</html>
