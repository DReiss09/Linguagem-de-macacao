<!DOCTYPE html>
<html lang="pt-br">
	<head>
		<meta charset="UTF-8">
		<title>Estilo Interno</title>
		<style>
							p{
				color: blue;
				font-size: 34px;
				font-family: Arial;
				}
				p{
				color: red;
				}
				p{
				color: purple;
				text-align: center;
				}
				/* chamando a classe -> usa-se . */
				.texto-verde{
				color: green;
				}
				/* chamando a classe -> usa-se # */
				#texto-rosa{
				color: pink
				}
		</style>
	</head>
	<body>  
		<P>Texto com estilo interno</P>
		<p class= "texto-verde">Texto 2</p>
		<p id="texto-rosa">Texto 3</p>
	</body>
</html>
